name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0

      - uses: bufbuild/buf-action@v1.6.0
        with:
          version: 1.74.0
          setup_only: true

      - name: Check generated code
        run: make gen-check

      - name: Generate from scratch in one run
        run: make gen-fresh-check

  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
          POSTGRES_DB: showcase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d showcase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://admin:password@127.0.0.1:5432/showcase?sslmode=disable
      DATABASE_WRITER_URL: postgres://showcase_writer:password@127.0.0.1:5432/showcase?sslmode=disable
      DATABASE_READER_URL: postgres://showcase_reader:password@127.0.0.1:5432/showcase?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Migrate database
        run: make db-migrate

      - name: Check the snapshot of the schema
        run: make db-describe-check

      - name: Run tests
        run: make test
