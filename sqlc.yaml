version: "2"
overrides:
  go:
    overrides:
      - db_type: "uuid"
        go_type:
          import: "uuid"
          type: "UUID"
      - db_type: "uuid"
        nullable: true
        go_type:
          import: "uuid"
          type: "UUID"
          pointer: true
      - db_type: "timestamptz"
        go_type: "time.Time"
      - db_type: "timestamptz"
        nullable: true
        go_type:
          import: "time"
          type: "Time"
          pointer: true
      - db_type: "text"
        nullable: true
        go_type:
          type: "string"
          pointer: true
      - db_type: "pg_catalog.bool"
        nullable: true
        go_type:
          type: "bool"
          pointer: true
      - db_type: "pg_catalog.int4"
        nullable: true
        go_type:
          type: "int32"
          pointer: true
      - db_type: "pg_catalog.float8"
        nullable: true
        go_type:
          type: "float64"
          pointer: true
sql:
  - engine: "postgresql"
    schema: "internal/infra/storage/db/migrate/sql"
    queries: "internal/feature/todo/queries/todo_queries.sql"
    gen:
      go:
        package: "queries"
        out: "internal/feature/todo/queries"
        sql_package: "pgx/v5"
        omit_unused_structs: true
