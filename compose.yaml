services:
  api:
    build:
      args:
        BIN_NAME: api
    environment:
      ENV: development
      MODULE_ROOT: /src
      DATABASE_URL: postgres://admin:password@db:5432/showcase?sslmode=disable
      DATABASE_WRITER_URL: postgres://showcase_writer:password@db:5432/showcase?sslmode=disable
      DATABASE_READER_URL: postgres://showcase_reader:password@db:5432/showcase?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - .:/src
      - go:/go
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: showcase
      DB_WRITER_PASSWORD: password
      DB_READER_PASSWORD: password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d showcase" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  go:
  db-data:
