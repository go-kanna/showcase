syntax = "proto3";

package showcase.todo.v1;

import "google/protobuf/timestamp.proto";

service TodoService {
  rpc ListTodo(ListTodoRequest) returns (ListTodoResponse);
  rpc PutTodo(PutTodoRequest) returns (PutTodoResponse);
  rpc SetTodoCompletion(SetTodoCompletionRequest) returns (SetTodoCompletionResponse);
  rpc DeleteTodo(DeleteTodoRequest) returns (DeleteTodoResponse);
  rpc AddComment(AddCommentRequest) returns (AddCommentResponse);
  rpc ListRecentComments(ListRecentCommentsRequest) returns (ListRecentCommentsResponse);
}

enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_LOW = 1;
  PRIORITY_NORMAL = 2;
  PRIORITY_HIGH = 3;
}

message Todo {
  string id = 1;
  string title = 2 [debug_redact = true];
  optional google.protobuf.Timestamp completed_at = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  Priority priority = 6;
  // comments are the three latest comments on the to-do, newest first.
  repeated Comment comments = 7;
  // comment_count is how many comments the to-do has, comments among them.
  int64 comment_count = 8;
}

message Comment {
  string id = 1;
  string body = 2 [debug_redact = true];
  google.protobuf.Timestamp created_at = 3;
}

message TodoInput {
  string id = 1;
  string title = 2 [
    debug_redact = true
  ];
  Priority priority = 3;
}

// CompletionFilter lists the to-dos completed, or those not.
message CompletionFilter {
  bool completed = 1;
}

// PriorityFilter lists the to-dos of one priority.
message PriorityFilter {
  Priority priority = 1;
}

message ListTodoRequest {
  // filter narrows the list to one condition, or none when left unset.
  oneof filter {
    CompletionFilter completion = 1;
    PriorityFilter priority = 2;
  }
  // page_size is how many to-dos a page holds: 20 when left 0, and 100 at most.
  int32 page_size = 3;
  // page_token is the next_page_token of the page before, or empty for the first page.
  string page_token = 4;
}

message ListTodoResponse {
  repeated Todo todos = 1;
  // next_page_token reads the page after this one, and is empty on the last.
  string next_page_token = 2;
}

message PutTodoRequest {
  TodoInput todo = 1;
  optional google.protobuf.Timestamp completed_at = 2;
}

message PutTodoResponse {}

message SetTodoCompletionRequest {
  string id = 1;
  bool completed = 2;
}

message SetTodoCompletionResponse {}

message DeleteTodoRequest {
  string id = 1;
}

message DeleteTodoResponse {}

message AddCommentRequest {
  string todo_id = 1;
  string body = 2 [debug_redact = true];
}

message AddCommentResponse {
  Comment comment = 1;
}

message ListRecentCommentsRequest {}

message ListRecentCommentsResponse {
  // comments are the 20 latest comments on any to-do, newest first.
  repeated CommentSummary comments = 1;
}

// CommentSummary is a comment with the to-do it is on.
message CommentSummary {
  string id = 1;
  string body = 2 [debug_redact = true];
  google.protobuf.Timestamp created_at = 3;
  TodoRef todo = 4;
}

// TodoRef names a to-do.
message TodoRef {
  string id = 1;
  string title = 2 [debug_redact = true];
}
