version: v2
inputs:
  - directory: .
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/go-kanna/showcase/internal/gen
clean: true
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: ../internal/gen
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.6.2
    out: ../internal/gen
    opt: paths=source_relative
